name: Bug Report
description: Report a Gainz app issue without sharing private tax data.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Please remove private tax data before posting screenshots, logs, or sample files.

        Gainz is designed for private offline reconciliation. Public GitHub issues should not contain real transaction exports, tax returns, wallet addresses, account numbers, or personal tax folders.
  - type: input
    id: version
    attributes:
      label: Gainz version
      description: Check the launcher, Dashboard, or /healthz endpoint.
      placeholder: Enter the version shown in Gainz Privacy Mode or /healthz
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: How are you running Gainz?
      options:
        - Windows packaged app
        - macOS packaged app
        - Source checkout
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the click path and inputs using sanitized examples.
      placeholder: |
        1. Open Import.
        2. Upload a sanitized Cash App sample.
        3. Click Run FIFO.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Gainz should show a reviewable import warning.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Gainz showed a 500 error.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Sanitized screenshots or logs
      description: Attach only redacted screenshots or minimal logs with private paths and account data removed.
