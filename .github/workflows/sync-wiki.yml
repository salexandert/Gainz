name: Sync Wiki From Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "scripts/generate_wiki_home.py"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate wiki pages
        run: python scripts/generate_wiki_home.py --output-dir build/wiki

      - name: Push generated pages to wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
          WIKI_REPO: ${{ github.repository }}.wiki.git
        shell: bash
        run: |
          set -euo pipefail

          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${WIKI_REPO}" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp build/wiki/*.md wiki/

          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already matches generated docs hub."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync wiki from docs"
          git push
