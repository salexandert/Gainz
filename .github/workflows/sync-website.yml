name: Trigger Website Sync

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - app_version.py
      - docs/**
      - .github/workflows/auto-tag-release.yml
      - .github/workflows/release.yml
      - .github/workflows/sync-wiki.yml
      - .github/workflows/sync-website.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch website sync
        env:
          WEBSITE_REPO_TOKEN: ${{ secrets.WEBSITE_REPO_TOKEN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBSITE_REPO_TOKEN" ]; then
            echo "::error::Website sync was not dispatched because WEBSITE_REPO_TOKEN is not configured."
            echo "Configure the cross-repository Actions credential before treating this workflow as successful."
            exit 1
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/salexandert/Gainz-Website/dispatches \
            -d "{\"event_type\":\"gainz-app-updated\",\"client_payload\":{\"ref\":\"$TARGET_SHA\"}}"
