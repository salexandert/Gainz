name: Release Download Snapshots

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture release downloads
        run: |
          python scripts/github_metrics.py \
            --downloads-only \
            --snapshot-dir metrics/github-release-downloads \
            --json

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- metrics/github-release-downloads; then
            git add metrics/github-release-downloads
            git commit -m "Record daily release download snapshot"
            git push
          else
            echo "No release download changes."
          fi
