name: Auto Tag Release Version

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - app_version.py
      - docs/_config.yml
      - .github/workflows/auto-tag-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version files
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release_version.py
          source scripts/release_version.env
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag when missing
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists locally."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Gainz $TAG"
          git push origin "$TAG"
