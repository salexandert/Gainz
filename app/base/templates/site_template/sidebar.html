<!-- sidebar menu -->
{% set current_path = request.path %}
<div class="logo">
  <a href="{{ url_for('home_blueprint.index') }}" class="simple-text logo-mini" aria-label="Gainz dashboard">
    <div class="logo-image-small">
      <img src="{{ url_for('static', filename='/assets/img/gainz_logo.jpg') }}" alt="Gainz logo">
    </div>
  </a>
  <a href="{{ url_for('home_blueprint.index') }}" class="simple-text logo-normal">
    Gainz!
  </a>
</div>
<div class="sidebar-wrapper">
  <ul class="nav">
    <li class="{% if current_path.startswith('/home') %}active{% endif %}">
      <a href="{{ url_for('home_blueprint.index') }}" {% if current_path.startswith('/home') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-bank" aria-hidden="true"></i>
        <p>Dashboard</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/import_transactions') %}active{% endif %}">
      <a href="{{ url_for('import_transactions_blueprint.import_wizard') }}" {% if current_path.startswith('/import_transactions') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-cloud-upload-94" aria-hidden="true"></i>
        <p>Import</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/holdings_accounting') %}active{% endif %}">
      <a href="{{ url_for('holdings_accounting_blueprint.holdings_accounting') }}" {% if current_path.startswith('/holdings_accounting') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-ruler-pencil" aria-hidden="true"></i>
        <p>Reconcile</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/tax_filing_review') %}active{% endif %}">
      <a href="{{ url_for('tax_filing_review_blueprint.index') }}" {% if current_path.startswith('/tax_filing_review') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-paper" aria-hidden="true"></i>
        <p>Tax Evidence</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/privacy') %}active{% endif %}">
      <a href="{{ url_for('privacy_blueprint.index') }}" {% if current_path.startswith('/privacy') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-lock-circle-open" aria-hidden="true"></i>
        <p>Privacy Mode</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/export') %}active{% endif %}">
      <a href="{{ url_for('export_blueprint.index') }}" {% if current_path.startswith('/export') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-share-66" aria-hidden="true"></i>
        <p>Reports & Export</p>
      </a>
    </li>

    <li class="sidebar-nav-label" aria-hidden="true">Advanced tools</li>
    <li class="{% if current_path.startswith('/auto_link') %}active{% endif %}">
      <a href="{{ url_for('auto_link_blueprint.auto_link') }}" {% if current_path.startswith('/auto_link') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-planet" aria-hidden="true"></i>
        <p>Auto Link</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/stats') %}active{% endif %}">
      <a href="{{ url_for('stats_blueprint.index') }}" {% if current_path.startswith('/stats') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-chart-bar-32" aria-hidden="true"></i>
        <p>Stats & Charts</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/model') %}active{% endif %}">
      <a href="{{ url_for('model_blueprint.index') }}" {% if current_path.startswith('/model') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-credit-card" aria-hidden="true"></i>
        <p>Model Sell</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/history') %}active{% endif %}">
      <a href="{{ url_for('history_blueprint.index') }}" {% if current_path.startswith('/history') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-hat-3" aria-hidden="true"></i>
        <p>History</p>
      </a>
    </li>
    <li class="{% if current_path.startswith('/add_links') %}active{% endif %}">
      <a href="{{ url_for('add_links_blueprint.add_links') }}" {% if current_path.startswith('/add_links') %}aria-current="page"{% endif %}>
        <i class="nc-icon nc-vector" aria-hidden="true"></i>
        <p>Manage Links</p>
      </a>
    </li>
  </ul>
</div>
